name: deploy SSJ poker AUTO V24 local to pages

on:
  push:
    branches:
      - vision-v1-brain-integration
    paths:
      - '.github/workflows/deploy-study-pages.yml'
      - 'standalone-lab/ssj-poker-auto-v24-local.html'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: vision-v1-brain-integration
      - name: Validate V24 static runtime
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('standalone-lab/ssj-poker-auto-v24-local.html')
          s=p.read_text(encoding='utf-8')
          assert 'getDisplayMedia' in s
          assert '/api/vision/read' not in s
          scripts=re.findall(r'<script>([\s\S]*?)</script>',s)
          assert scripts, 'inline script not found'
          Path('/tmp/v24.js').write_text(scripts[-1],encoding='utf-8')
          print('V24 html guards OK')
          PY
          node --check /tmp/v24.js
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Prepare site
        run: |
          mkdir -p _site
          cp standalone-lab/ssj-poker-auto-v24-local.html _site/index.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
