name: fix-runtime-capture-stability
on:
  push:
    branches: [vision-v1-brain-integration]
    paths:
      - '.github/workflows/fix-runtime-capture-stability.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: vision-v1-brain-integration
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Patch runtime
        run: python scripts/fix-runtime-capture-stability.py
      - name: Focused tests
        run: |
          node tests/study-public-runtime-v1.test.mjs
          node tests/strategy-v1-preflop.test.mjs
          node tests/action-capture-v1.test.mjs
          node tests/action-band-v1.test.mjs
          node tests/action-seat-state-v1.test.mjs
          node tests/action-ocr-gate-v1.test.mjs
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add standalone-lab/study-runtime-public-v1.html tests/study-public-runtime-v1.test.mjs
          git commit -m "fix: preserve hand position and enrich local action history" || exit 0
          git push origin HEAD:vision-v1-brain-integration
