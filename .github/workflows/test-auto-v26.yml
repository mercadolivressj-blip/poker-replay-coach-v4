name: Test AUTO V26

on:
  push:
    branches: [vision-v1-brain-integration]
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: vision-v1-brain-integration
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate V26 wrapper and module graph
        run: |
          python3 - <<'PY'
          from pathlib import Path
          s=Path('standalone-lab/ssj-poker-auto-v26-local.html').read_text(encoding='utf-8')
          assert 'postflop-policy-v4-browser-safe.js' in s
          assert "../src/core/pokerstars-local-cards.js" in s
          assert 'Guard de segurança' in s
          safe=Path('src/brain/postflop-policy-v4-browser-safe.js').read_text(encoding='utf-8')
          assert 'import ' not in safe
          print('V26 static guards OK')
          PY
          node --input-type=module - <<'JS'
          const roots = [
            './src/core/pokerstars-local-cards.js',
            './src/core/geometry.js',
            './src/core/action-capture.js',
            './src/core/action-band.js',
            './src/core/action-ocr.js',
            './src/core/dealer-button.js',
            './src/brain/preflop.js',
            './src/brain/postflop-policy-v4-browser-safe.js',
          ];
          for (const p of roots) {
            await import(p);
            console.log('OK', p);
          }
          JS
