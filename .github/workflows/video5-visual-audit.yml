name: video5-visual-audit

on:
  push:
    branches: [vision-v1-brain-integration]
    paths: ['.github/workflows/video5-visual-audit.yml']
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  build-audit-pdf:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: vision-v1-brain-integration
          fetch-depth: 0
      - name: Install audit dependencies
        run: python3 -m pip install opencv-python-headless==4.10.0.84 reportlab==4.4.3
      - name: Download immutable first blind artifact
        uses: actions/download-artifact@v4
        with:
          name: video5-blind-first-score
          path: /tmp/blind
          github-token: ${{ github.token }}
          repository: mercadolivressj-blip/poker-replay-coach-v4
          run-id: 35659346135
      - name: Download source video 5
        shell: bash
        run: |
          python3 -m pip install gdown==5.2.0
          python3 -m gdown --id 1SAgHbXCsywFd7xu4XVZ6VW09a0O_RNfx -O /tmp/video5.mkv
          test "$(stat -c%s /tmp/video5.mkv)" = "272066919"
      - name: Build independent visual audit PDF
        shell: bash
        run: |
          mkdir -p standalone-lab/calibration/video5-audit
          python3 - <<'PY'
          import cv2, glob, json, os
          from reportlab.pdfgen import canvas
          from reportlab.lib.pagesizes import landscape, A4
          from reportlab.lib.utils import ImageReader

          raw=json.load(open(glob.glob('/tmp/blind/*.json')[0]))
          ds=raw['decisions']
          def sig(d):
              return (tuple(d.get('heroCards') or []), tuple(d.get('board') or []), d.get('heroStack'), d.get('pot'), d.get('toCall'), d.get('position'), d.get('buttonLayout'))
          groups=[]
          for d in ds:
              if groups and sig(groups[-1][-1])==sig(d) and d['t']-groups[-1][-1]['t']<=1.6:
                  groups[-1].append(d)
              else:
                  groups.append([d])
          # Two known hand-boundary duplicates have identical state but changed hand ID;
          # signature grouping intentionally ignores hand ID.
          assert len(groups)==37, len(groups)
          reps=[]
          for gi,g in enumerate(groups,1):
              # strongest/most stable snapshot from the physical window
              d=max(g,key=lambda x:(x.get('windowConsensus',0),x.get('buttonStrength',0)))
              reps.append((gi,d,[x['i'] for x in g]))
          open('standalone-lab/calibration/video5-audit/physical-decisions-v1.json','w').write(json.dumps([
              {'physicalDecision':gi,'rawDecisionIds':ids,'t':d['t'],'hand':d['hand'],'heroCards':d['heroCards'],'board':d['board'],'heroStack':d['heroStack'],'pot':d['pot'],'toCall':d['toCall'],'position':d['position'],'layout':d['buttonLayout'],'brainGate':d['brainGate']}
              for gi,d,ids in reps],indent=2))

          cap=cv2.VideoCapture('/tmp/video5.mkv'); assert cap.isOpened(); fps=cap.get(cv2.CAP_PROP_FPS)
          wanted=[]
          for gi,d,ids in reps:
              for dt,label in [(-0.5,'PRE'),(0.0,'DECISION'),(0.8,'POST+0.8'),(1.8,'POST+1.8'),(3.0,'POST+3.0')]:
                  t=max(0,float(d['t'])+dt); wanted.append((int(round(t*fps)),gi,label,t,d,ids))
          byframe={x[0]:x[1:] for x in wanted}; frames={}; fi=0; last=max(byframe)
          while fi<=last:
              ok=cap.grab()
              if not ok: break
              if fi in byframe:
                  ok,im=cap.retrieve(); assert ok; frames[fi]=im.copy()
              fi+=1
          cap.release(); assert len(frames)==len(byframe),(len(frames),len(byframe))

          W,H=landscape(A4); pdf='standalone-lab/calibration/video5-audit/video5-physical-decisions-audit-v1.pdf'; c=canvas.Canvas(pdf,pagesize=(W,H))
          def add_img(im,x,y,w,h):
              # BGR->RGB and in-memory JPEG
              ok,b=cv2.imencode('.jpg',im,[int(cv2.IMWRITE_JPEG_QUALITY),95]); assert ok
              c.drawImage(ImageReader(b.tobytes()),x,y,w,h,preserveAspectRatio=True,anchor='c')
          for gi,d,ids in reps:
              c.setFont('Helvetica-Bold',12); c.drawString(18,H-20,f'VIDEO 5 — Physical decision {gi}/37 | raw IDs {ids} | t={d["t"]:.3f}s | hand={d["hand"]}')
              c.setFont('Helvetica',9); c.drawString(18,H-34,f'Hero={d["heroCards"]}  Board={d["board"]}  Stack={d["heroStack"]}  Pot={d["pot"]}  toCall={d["toCall"]}  Pos={d["position"]}  Layout={d["buttonLayout"]}')
              # main decision frame large
              mainfi=int(round(float(d['t'])*fps)); main=frames[mainfi]
              add_img(main,18,155,500,281)
              # crops: hero/board, money/buttons, entire table
              hero=main[420:490,455:825]; money=main[195:545,570:760]; buttons=main[600:715,610:1245]
              add_img(hero,530,350,280,85); add_img(money,530,235,180,105); add_img(buttons,530,155,280,70)
              # follow-up strip across bottom
              x=18
              for dt,label in [(0.8,'+0.8s'),(1.8,'+1.8s'),(3.0,'+3.0s')]:
                  fi2=int(round((float(d['t'])+dt)*fps)); im=frames.get(fi2)
                  if im is not None:
                      c.setFont('Helvetica',7); c.drawString(x,140,label)
                      add_img(im,x,10,250,125); x+=260
              c.showPage()
          c.save(); print('AUDIT_PDF',pdf,'PAGES',len(reps))
          PY
      - name: Commit audit PDF and frozen physical-decision index
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add standalone-lab/calibration/video5-audit/video5-physical-decisions-audit-v1.pdf standalone-lab/calibration/video5-audit/physical-decisions-v1.json
          git commit -m 'test: add video5 visual audit packet'
          git push origin HEAD:vision-v1-brain-integration
