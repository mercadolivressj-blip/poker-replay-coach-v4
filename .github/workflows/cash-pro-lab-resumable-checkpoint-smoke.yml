name: cash-pro-lab-resumable-checkpoint-smoke

on:
  workflow_dispatch:
  pull_request:
    paths:
      - patches/postflop-raked-checkpoint-v2.mjs
      - src/cash-pro-lab/highrake-postflop-job-builder.js
      - tools/highrake-action-ev/**
      - scripts/cash-pro-lab-resumable-prepare.mjs
      - scripts/cash-pro-lab-resumable-probe.mjs
      - .github/workflows/cash-pro-lab-resumable-checkpoint-smoke.yml
  push:
    branches:
      - cash-pro-lab-convergence-guard
    paths:
      - patches/postflop-raked-checkpoint-v2.mjs
      - src/cash-pro-lab/highrake-postflop-job-builder.js
      - tools/highrake-action-ev/**
      - scripts/cash-pro-lab-resumable-prepare.mjs
      - scripts/cash-pro-lab-resumable-probe.mjs
      - .github/workflows/cash-pro-lab-resumable-checkpoint-smoke.yml

permissions:
  contents: read

jobs:
  checkpoint-resume:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Fetch exact pinned solver and apply deterministic rewrite
        run: |
          git clone --filter=blob:none https://github.com/ucsandman/postflop.git /tmp/postflop
          git -C /tmp/postflop checkout 5fc7ee3d92b823b6c58e4f58cbee7d50d5e9e6de
          test "$(git -C /tmp/postflop rev-parse HEAD)" = "5fc7ee3d92b823b6c58e4f58cbee7d50d5e9e6de"
          node patches/postflop-raked-checkpoint-v2.mjs /tmp/postflop
          git -C /tmp/postflop diff --check
          grep -F 'pub fn save_checkpoint' /tmp/postflop/engine/src/cfr.rs
          grep -F 'pub fn restore_checkpoint' /tmp/postflop/engine/src/cfr.rs
          grep -F 'self.icm.is_none() && self.cfg.rake.percent == 0.0' /tmp/postflop/engine/src/nlhe.rs
          grep -F 'target_confirmations' /tmp/postflop/cli/src/solve.rs

      - name: Build patched solver and independent verifier
        run: |
          cargo build --release --manifest-path /tmp/postflop/Cargo.toml --bin solver
          cargo build --release --manifest-path tools/highrake-action-ev/Cargo.toml --bin solution-nashconv

      - name: Write tiny raked fixture
        run: |
          mkdir -p checkpoint-smoke
          cat > checkpoint-smoke/spot.toml <<'EOF'
          board = "Ks 7d 2c 8h 3d"
          oop_range = "KK,A4s,A5s"
          ip_range = "TT,JJ"
          effective_stack = 10.0
          starting_pot = 10.0
          allin_threshold = 1.5
          raise_cap = 0
          target_exploitability = 0.000001
          max_iterations = 2
          alpha = 1.5
          beta = 0.0
          gamma = 2.0
          turn_chance_sampling = false
          regret_floor = false

          [rake]
          percent = 5.0
          cap = 2.5

          [sizings.oop.river]
          bet = { percents = [100.0] }
          [sizings.ip.river]
          bet = { percents = [100.0] }
          EOF

      - name: Checkpoint at iteration 1 and resume exactly to iteration 2
        run: |
          /tmp/postflop/target/release/solver solve \
            --config checkpoint-smoke/spot.toml --report-every 1 --threads 1 \
            --max-iterations 1 --checkpoint checkpoint-smoke/state.bin \
            2>&1 | tee checkpoint-smoke/first.log
          test -s checkpoint-smoke/state.bin
          grep -E 'iter +1 +NashConv ' checkpoint-smoke/first.log

          /tmp/postflop/target/release/solver solve \
            --config checkpoint-smoke/spot.toml --report-every 1 --threads 1 \
            --max-iterations 2 --checkpoint checkpoint-smoke/state.bin \
            --resume checkpoint-smoke/state.bin --out checkpoint-smoke/resumed.json \
            2>&1 | tee checkpoint-smoke/resumed.log
          grep -E 'resumed checkpoint .* iteration 1' checkpoint-smoke/resumed.log
          grep -E 'iter +2 +NashConv ' checkpoint-smoke/resumed.log
          test -s checkpoint-smoke/resumed.json

      - name: Compare resumed state with uninterrupted solve
        run: |
          /tmp/postflop/target/release/solver solve \
            --config checkpoint-smoke/spot.toml --report-every 1 --threads 1 \
            --max-iterations 2 --out checkpoint-smoke/fresh.json \
            > checkpoint-smoke/fresh.log 2>&1
          node <<'NODE'
          const fs=require('fs');
          const assert=require('assert').strict;
          const a=JSON.parse(fs.readFileSync('checkpoint-smoke/resumed.json','utf8'));
          const b=JSON.parse(fs.readFileSync('checkpoint-smoke/fresh.json','utf8'));
          assert.equal(a.meta.iterations,2);
          assert.equal(b.meta.iterations,2);
          const strip=x=>({config:x.config,node_count:x.node_count,nodes:x.nodes,root_combos:x.root_combos,meta:{...x.meta,wall_seconds:0}});
          assert.deepEqual(strip(a),strip(b));
          console.log('exact resume parity: PASS');
          NODE

      - name: Independently recompute saved-profile NashConv
        run: |
          tools/highrake-action-ev/target/release/solution-nashconv \
            checkpoint-smoke/resumed.json checkpoint-smoke/verify.json 0.0002
          node -e "const v=require('./checkpoint-smoke/verify.json');if(!v.verified||v.max_abs_meta_diff>0.0002)process.exit(2);console.log(JSON.stringify(v,null,2));"

      - name: Upload evidence
        uses: actions/upload-artifact@v4
        with:
          name: cash-pro-lab-resumable-checkpoint-smoke
          path: checkpoint-smoke
          retention-days: 14
