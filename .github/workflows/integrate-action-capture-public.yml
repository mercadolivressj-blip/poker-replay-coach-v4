name: integrate-action-capture-public
on:
  push:
    branches: [vision-v1-brain-integration]
    paths:
      - '.github/workflows/integrate-action-capture-public.yml'
permissions:
  contents: write
jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: vision-v1-brain-integration
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Integrate Action Capture
        run: python scripts/integrate-public-action-capture.py
      - name: Focused tests
        run: |
          node tests/study-public-runtime-v1.test.mjs
          node tests/strategy-v1-preflop.test.mjs
      - name: Commit integration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add standalone-lab/study-runtime-public-v1.html tests/study-public-runtime-v1.test.mjs
          git commit -m "feat: make Action Capture V1.8 sovereign preflop history" || exit 0
          git push origin HEAD:vision-v1-brain-integration
