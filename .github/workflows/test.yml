name: tests
on:
  push:
  pull_request:
jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install
      - run: npm test
      - run: node tests/runtime-contract.test.mjs
      - run: node tests/brain-v1.test.mjs
      - run: node tests/hand-transition-v1.test.mjs
      - run: node tests/action-ledger-v1.test.mjs
      - run: node tests/study-session-v1.test.mjs
