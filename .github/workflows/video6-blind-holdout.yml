name: video6-blind-holdout

on:
  push:
    branches: [vision-v1-brain-integration]
    paths:
      - '.github/workflows/video6-blind-holdout.yml'
      - 'tests/offline_video6_blind.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  video6-blind:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout integration branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build exact approved post-blind V7 harness over frozen reader
        shell: bash
        run: |
          set -euo pipefail
          V7_REF=c1aecb66e73464a2c9b17a8f31f2aa888c6c48d3
          git show "${V7_REF}:tools/holdout/video5_blind_scan.py" > /tmp/video5_blind_scan.py
          for f in \
            patch_video5_harness_v3.py \
            patch_video5_ledger_v4.py \
            patch_video5_ledger_v5.py \
            patch_video5_ledger_v6.py \
            patch_video5_ledger_v7.py
          do
            git show "${V7_REF}:tools/holdout/${f}" > "/tmp/${f}"
          done
          sed -i 's/assert stack\.add_labeled(/stack.add_labeled(/' /tmp/video5_blind_scan.py
          sed -i 's/assert pot\.add_labeled(/pot.add_labeled(/' /tmp/video5_blind_scan.py
          sed -i 's/assert add_commitment_labeled(/add_commitment_labeled(/' /tmp/video5_blind_scan.py
          python3 /tmp/patch_video5_harness_v3.py /tmp/video5_blind_scan.py
          python3 /tmp/patch_video5_ledger_v4.py /tmp/video5_blind_scan.py
          python3 /tmp/patch_video5_ledger_v5.py /tmp/video5_blind_scan.py
          python3 /tmp/patch_video5_ledger_v6.py /tmp/video5_blind_scan.py
          python3 /tmp/patch_video5_ledger_v7.py /tmp/video5_blind_scan.py
          python3 -m py_compile /tmp/video5_blind_scan.py
          git reset --hard cdecb04b6230a343535fcca5129a14a5579ea44f
          git clean -fdx
          test "$(git rev-parse HEAD)" = "cdecb04b6230a343535fcca5129a14a5579ea44f"
          echo "FROZEN_READER_HEAD=$(git rev-parse HEAD)"
          echo "V7_HARNESS_REF=${V7_REF}"

      - name: Install dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update >/dev/null
          sudo apt-get install -y ffmpeg >/dev/null
          python3 -m pip install --upgrade pip >/dev/null
          python3 -m pip install numpy==1.26.4 opencv-python-headless==4.10.0.84 gdown==5.2.0 >/dev/null

      - name: Download frozen calibration and blind holdout
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/videos /tmp/video6-out
          python3 -m gdown --id 1d0FQNW2qziQENcwrK7YeB-xkLrdOPeBw -O /tmp/videos/video1.mkv >/dev/null
          python3 -m gdown --id 1YKXAEqe-5gwb0iTwIF816GCv1Tc8hn0e -O /tmp/videos/video2.mkv >/dev/null
          python3 -m gdown --id 1Q5tejtFpbnbNOWMP9RbarFFlVjpvom28 -O /tmp/videos/video6.mkv >/dev/null
          test "$(stat -c%s /tmp/videos/video1.mkv)" = "323158352"
          test "$(stat -c%s /tmp/videos/video2.mkv)" = "174103044"
          test "$(stat -c%s /tmp/videos/video6.mkv)" = "209930974"
          ffprobe -v error -select_streams v:0 -show_entries stream=width,height,r_frame_rate -of default=nw=1 /tmp/videos/video6.mkv

      - name: Run strict blind video 6 scan
        shell: bash
        run: |
          set -euo pipefail
          python3 /tmp/video5_blind_scan.py \
            /tmp/videos/video1.mkv \
            /tmp/videos/video2.mkv \
            /tmp/videos/video6.mkv \
            /tmp/video6-out/video6-blind-first-score.json

      - name: Show blind summary
        if: always()
        shell: bash
        run: |
          if test -f /tmp/video6-out/video6-blind-first-score.json; then
            python3 - <<'PY'
          import hashlib, json
          p = '/tmp/video6-out/video6-blind-first-score.json'
          raw = open(p, 'rb').read()
          d = json.loads(raw)
          print('VIDEO6_BLIND_SUMMARY=' + json.dumps(d.get('summary', {}), separators=(',', ':')))
          print('VIDEO6_RAW_BYTES=' + str(len(raw)))
          print('VIDEO6_RAW_SHA256=' + hashlib.sha256(raw).hexdigest())
          PY
          fi

      - name: Upload immutable first blind result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: video6-blind-first-score
          path: /tmp/video6-out/
          if-no-files-found: warn
          retention-days: 7
