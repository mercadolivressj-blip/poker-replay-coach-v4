name: video6-blind-holdout

on:
  push:
    branches: [vision-v1-brain-integration]
    paths:
      - '.github/workflows/video6-blind-holdout.yml'
      - 'tests/offline_video6_blind.py'
  workflow_dispatch:

jobs:
  video6-blind:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Copy blind harness out of worktree
        run: cp tests/offline_video6_blind.py /tmp/offline_video6_blind.py

      - name: Reset reader to frozen source HEAD
        run: |
          git reset --hard cdecb04b6230a343535fcca5129a14a5579ea44f
          git clean -fdx
          git rev-parse HEAD

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          python3 -m pip install --upgrade pip
          python3 -m pip install opencv-python-headless numpy gdown

      - name: Download calibration videos and blind holdout
        run: |
          mkdir -p /tmp/videos /tmp/video6-out
          gdown 'https://drive.google.com/uc?id=1d0FQNW2qziQENcwrK7YeB-xkLrdOPeBw' -O '/tmp/videos/video1.mkv'
          gdown 'https://drive.google.com/uc?id=1YKXAEqe-5gwb0iTwIF816GCv1Tc8hn0e' -O '/tmp/videos/video2.mkv'
          gdown 'https://drive.google.com/uc?id=1Q5tejtFpbnbNOWMP9RbarFFlVjpvom28' -O '/tmp/videos/video6.mkv'
          test $(stat -c%s /tmp/videos/video1.mkv) -eq 323158352
          test $(stat -c%s /tmp/videos/video2.mkv) -eq 174103044
          test $(stat -c%s /tmp/videos/video6.mkv) -eq 209930974

      - name: Run strict blind video 6 scan
        env:
          VIDEO1: /tmp/videos/video1.mkv
          VIDEO2: /tmp/videos/video2.mkv
          VIDEO6: /tmp/videos/video6.mkv
          OUT_DIR: /tmp/video6-out
        run: python3 /tmp/offline_video6_blind.py

      - name: Show blind summary
        if: always()
        run: |
          test -f /tmp/video6-out/video6-blind-first-score.json && cat /tmp/video6-out/video6-blind-first-score.json || true

      - name: Upload first blind result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: video6-blind-first-score
          path: /tmp/video6-out/
          if-no-files-found: warn
