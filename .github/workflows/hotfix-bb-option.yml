name: hotfix-bb-option
on:
  push:
    branches: [vision-v1-brain-integration]
    paths: ['.github/workflows/hotfix-bb-option.yml']
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: vision-v1-brain-integration
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Patch BB option routing
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          # --- Brain: CHECK+RAISE preflop is sovereign evidence of BB option. ---
          p=Path('src/brain/preflop.js')
          s=p.read_text()
          old="""export function preflopDecision(state,context={}){\n const legal=state.legalActions||[]; const position=normalizePosition(state.heroPosition); const hc=handCode(state.heroCards);\n if(!hc||!position||!legal.length) return {decision:null,engine:'BRAIN GATE',reason:'Faltam cartas, posição ou ações legais confirmadas.',confidence:0,street:'preflop'};\n const depth=effectiveDepthBB(state.heroStack,state.effectiveStack,state.blinds);\n // BB can never be an unopened RFI decision in 6-max. If CALL/FOLD are present, some prior action exists;\n // without a confirmed opener/node we must fail closed instead of routing to the empty legacy BB RFI chart.\n const explicitNode=String(context?.preflopNode??context?.node??'').trim().toLowerCase();\n const legalSet=new Set(legal.map(x=>String(x).toUpperCase()));\n"""
          new="""export function preflopDecision(state,context={}){\n const legal=state.legalActions||[]; const hc=handCode(state.heroCards);\n const legalSet=new Set(legal.map(x=>String(x).toUpperCase()));\n const bbFreeOption=legalSet.has('CHECK')&&legalSet.has('RAISE')&&!legalSet.has('CALL')&&!legalSet.has('FOLD')&&!(state.board||[]).length;\n let position=bbFreeOption?'BB':normalizePosition(state.heroPosition);\n if(!hc||!position||!legal.length) return {decision:null,engine:'BRAIN GATE',reason:'Faltam cartas, posição ou ações legais confirmadas.',confidence:0,street:'preflop'};\n const depth=effectiveDepthBB(state.heroStack,state.effectiveStack,state.blinds);\n // CHECK + RAISE preflop is sovereign evidence of the BB option after one or more limps/completes.\n // It overrides noisy position metadata for this decision only.\n const explicitNode=String(context?.preflopNode??context?.node??'').trim().toLowerCase();\n"""
          if old not in s:
              raise SystemExit('preflop header anchor not found')
          s=s.replace(old,new,1)

          anchor=""" if((context.format||'cash')!=='cash'){\n   const approx=mttApprox({state,context,legal,position,depth})||pack(null,'MTT PREFLOP V1 · APROXIMAÇÃO','Sem decisão confiável para este node.',0);\n   return {...approx,certification:'approximation-only',chartCertified:false,icmCertified:false,solverCertified:false};\n }\n\n // AUTHORITATIVE frozen Strategy V1 baseline first.\n"""
          repl=""" if((context.format||'cash')!=='cash'){\n   const approx=mttApprox({state,context,legal,position,depth})||pack(null,'MTT PREFLOP V1 · APROXIMAÇÃO','Sem decisão confiável para este node.',0);\n   return {...approx,certification:'approximation-only',chartCertified:false,icmCertified:false,solverCertified:false};\n }\n\n // Dedicated 100bb BB option fallback. The frozen direct baseline has no limp-pot node.\n // Keep this explicitly labelled as heuristic; never pretend it is part of the audited chart.\n if(bbFreeOption){\n   if(depth==null||depth<90||depth>110) return pack(null,'PREFLOP V1 · FORA DA FAIXA','BB option detectado, mas a cobertura atual continua restrita a ~90–110bb.',0);\n   const iso=range('88+,AJs+,AQo+,KQs,A5s,A4s');\n   if(iso.has(hc)&&legalSet.has('RAISE')) return pack('AUMENTAR','PREFLOP V1 · BB OPTION · HEURÍSTICA',`BB após limp(s): ${hc} entra na faixa conservadora de iso-raise; node ainda não é chart-certificado.`,60,{inferredPosition:'BB',node:'bb_limp_option',chartCertified:false});\n   if(legalSet.has('CHECK')) return pack('PASSAR','PREFLOP V1 · BB OPTION · HEURÍSTICA',`BB após limp(s): ${hc} pode realizar a opção grátis; node ainda não é chart-certificado.`,62,{inferredPosition:'BB',node:'bb_limp_option',chartCertified:false});\n }\n\n // AUTHORITATIVE frozen Strategy V1 baseline first.\n"""
          if anchor not in s:
              raise SystemExit('preflop cash anchor not found')
          s=s.replace(anchor,repl,1)
          p.write_text(s)

          # --- Public runtime: show the sovereign BB inference immediately. ---
          p=Path('standalone-lab/study-runtime-public-v1.html')
          s=p.read_text()
          old="""  }else if(scope==='actions'){\n    if(Array.isArray(x.legalActions)){state.legalActions=[...x.legalActions];fieldSeen.actions=r.at;}\n    if(Object.prototype.hasOwnProperty.call(x,'toCall')){state.toCall=x.toCall??null;fieldSeen.toCall=r.at;}\n    if(!state.legalActions.length)state.toCall=null;\n    normalizeToCall();\n"""
          new="""  }else if(scope==='actions'){\n    if(Array.isArray(x.legalActions)){state.legalActions=[...x.legalActions];fieldSeen.actions=r.at;}\n    if(Object.prototype.hasOwnProperty.call(x,'toCall')){state.toCall=x.toCall??null;fieldSeen.toCall=r.at;}\n    if(!state.legalActions.length)state.toCall=null;\n    normalizeToCall();\n    const la=new Set(state.legalActions);\n    if(state.board.length===0&&la.has('CHECK')&&la.has('RAISE')&&!la.has('CALL')&&!la.has('FOLD')){\n      if(state.heroPosition!=='BB')log('posição corrigida por CHECK pré-flop: BB');\n      lockedPosition='BB';state.heroPosition='BB';fieldSeen.position=r.at;metaUrgent=false;\n    }\n"""
          if old not in s:
              raise SystemExit('runtime actions anchor not found')
          s=s.replace(old,new,1)
          p.write_text(s)

          # --- Regression: exact screenshot class (44, wrong HJ metadata, CHECK+RAISE). ---
          p=Path('tests/strategy-v1-preflop.test.mjs')
          s=p.read_text()
          marker="console.log('strategy-v1-preflop parity + impossible-RFI + structured-history regression: OK');"
          extra="""const bbLimpOption44=preflopDecision({\n  heroCards:['4h','4d'],board:[],heroPosition:'HJ',legalActions:['CHECK','RAISE'],\n  actionHistory:['Desmond Lam: POST SB 0.01','N.Neumann.83: POST BB 0.02','wruckzinho: CALL 0.02'],\n  heroStack:'1.98',effectiveStack:'1.98',blinds:'0.01/0.02',pot:'0.07',toCall:null\n},{format:'cash',tableSize:'6max',handId:'field-bb-option-44'});\nassert.equal(bbLimpOption44.decision,'PASSAR');\nassert.match(bbLimpOption44.engine,/BB OPTION/);\nassert.equal(bbLimpOption44.inferredPosition,'BB');\nassert.equal(bbLimpOption44.chartCertified,false);\n\nconst bbLimpOptionAQ=preflopDecision({\n  heroCards:['Ah','Qh'],board:[],heroPosition:'HJ',legalActions:['CHECK','RAISE'],\n  actionHistory:['UTG CALL 0.02'],heroStack:'2.00',effectiveStack:'2.00',blinds:'0.01/0.02',pot:'0.05'\n},{format:'cash',tableSize:'6max',handId:'field-bb-option-aqs'});\nassert.equal(bbLimpOptionAQ.decision,'AUMENTAR');\nassert.match(bbLimpOptionAQ.engine,/BB OPTION/);\n\nconsole.log('strategy-v1-preflop parity + impossible-RFI + structured-history + BB-option regression: OK');"""
          if marker not in s:
              raise SystemExit('preflop test marker not found')
          s=s.replace(marker,extra,1)
          p.write_text(s)

          p=Path('tests/study-public-runtime-v1.test.mjs')
          s=p.read_text()
          marker="assert.match(html,/manualNode/);"
          repl="""assert.match(html,/manualNode/);\nassert.match(html,/posição corrigida por CHECK pré-flop: BB/);\nassert.match(html,/lockedPosition='BB'/);"""
          if marker not in s:
              raise SystemExit('runtime test marker not found')
          s=s.replace(marker,repl,1)
          p.write_text(s)
          PY
      - name: Validate focused regressions
        run: |
          node tests/strategy-v1-preflop.test.mjs
          node tests/study-public-runtime-v1.test.mjs
      - name: Commit hotfix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/brain/preflop.js standalone-lab/study-runtime-public-v1.html tests/strategy-v1-preflop.test.mjs tests/study-public-runtime-v1.test.mjs
          git commit -m "fix: route preflop BB option after limpers" || exit 0
          git push origin HEAD:vision-v1-brain-integration
