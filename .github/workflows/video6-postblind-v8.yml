name: video6-postblind-v8

on:
  push:
    branches: [vision-v1-brain-integration]
    paths:
      - '.github/workflows/video6-postblind-v8.yml'
      - 'tools/holdout/patch_video6_generic_safety_v8.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  video6-v8:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build approved V7 plus generic V8 repair
        shell: bash
        run: |
          set -euo pipefail
          V7_REF=c1aecb66e73464a2c9b17a8f31f2aa888c6c48d3
          git show "${V7_REF}:tools/holdout/video5_blind_scan.py" > /tmp/scan.py
          for f in patch_video5_harness_v3.py patch_video5_ledger_v4.py patch_video5_ledger_v5.py patch_video5_ledger_v6.py patch_video5_ledger_v7.py; do
            git show "${V7_REF}:tools/holdout/${f}" > "/tmp/${f}"
          done
          cp tools/holdout/patch_video6_generic_safety_v8.py /tmp/patch_v8.py
          sed -i 's/assert stack\.add_labeled(/stack.add_labeled(/' /tmp/scan.py
          sed -i 's/assert pot\.add_labeled(/pot.add_labeled(/' /tmp/scan.py
          sed -i 's/assert add_commitment_labeled(/add_commitment_labeled(/' /tmp/scan.py
          python3 /tmp/patch_video5_harness_v3.py /tmp/scan.py
          python3 /tmp/patch_video5_ledger_v4.py /tmp/scan.py
          python3 /tmp/patch_video5_ledger_v5.py /tmp/scan.py
          python3 /tmp/patch_video5_ledger_v6.py /tmp/scan.py
          python3 /tmp/patch_video5_ledger_v7.py /tmp/scan.py
          python3 /tmp/patch_v8.py /tmp/scan.py
          python3 -m py_compile /tmp/scan.py
          git reset --hard cdecb04b6230a343535fcca5129a14a5579ea44f
          git clean -fdx
          test "$(git rev-parse HEAD)" = "cdecb04b6230a343535fcca5129a14a5579ea44f"

      - name: Install dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update >/dev/null
          sudo apt-get install -y ffmpeg >/dev/null
          python3 -m pip install --upgrade pip >/dev/null
          python3 -m pip install numpy==1.26.4 opencv-python-headless==4.10.0.84 gdown==5.2.0 >/dev/null

      - name: Download calibration plus video6
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/videos /tmp/out
          python3 -m gdown --id 1d0FQNW2qziQENcwrK7YeB-xkLrdOPeBw -O /tmp/videos/video1.mkv >/dev/null
          python3 -m gdown --id 1YKXAEqe-5gwb0iTwIF816GCv1Tc8hn0e -O /tmp/videos/video2.mkv >/dev/null
          python3 -m gdown --id 1Q5tejtFpbnbNOWMP9RbarFFlVjpvom28 -O /tmp/videos/video6.mkv >/dev/null
          test "$(stat -c%s /tmp/videos/video1.mkv)" = "323158352"
          test "$(stat -c%s /tmp/videos/video2.mkv)" = "174103044"
          test "$(stat -c%s /tmp/videos/video6.mkv)" = "209930974"

      - name: Run post-blind V8
        shell: bash
        run: |
          set -euo pipefail
          python3 /tmp/scan.py /tmp/videos/video1.mkv /tmp/videos/video2.mkv /tmp/videos/video6.mkv /tmp/out/video6-v8.json

      - name: Print V8 summary
        if: always()
        shell: bash
        run: |
          if test -f /tmp/out/video6-v8.json; then
            python3 - <<'PY'
          import json, hashlib
          p='/tmp/out/video6-v8.json'; raw=open(p,'rb').read(); d=json.loads(raw)
          print('V8_SUMMARY='+json.dumps(d.get('summary',{}),separators=(',',':')))
          print('V8_SHA256='+hashlib.sha256(raw).hexdigest())
          for i in [3,5,6,10,12,14,21,24,28,33,40,44,48,49,52]:
              x=next((q for q in d.get('decisions',[]) if q.get('i')==i),None)
              if x: print('D',i,'tc',x.get('toCall'),'gate',x.get('brainGate'),'action',x.get('heroAction'),'src',x.get('commitmentSources'))
          PY
          fi

      - name: Upload V8 result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: video6-postblind-v8
          path: /tmp/out/
          if-no-files-found: error
          retention-days: 7
