name: video5-blind-holdout

on:
  push:
    branches:
      - vision-v1-brain-integration
    paths:
      - '.github/workflows/video5-blind-holdout.yml'
      - 'tools/holdout/video5_blind_scan.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  blind-video5:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout integration branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Freeze scanner then reset reader to requested HEAD
        shell: bash
        run: |
          set -euo pipefail
          cp tools/holdout/video5_blind_scan.py /tmp/video5_blind_scan.py
          # Harness-only portability fixes. Reader code remains frozen and
          # video 5 contributes zero labels/templates/thresholds.
          sed -i 's/assert stack\.add_labeled(/stack.add_labeled(/' /tmp/video5_blind_scan.py
          sed -i 's/assert pot\.add_labeled(/pot.add_labeled(/' /tmp/video5_blind_scan.py
          sed -i 's/assert add_commitment_labeled(/add_commitment_labeled(/' /tmp/video5_blind_scan.py
          python3 - <<'PY'
          from pathlib import Path
          p = Path('/tmp/video5_blind_scan.py')
          s = p.read_text()
          # One physical button window must remain one decision even if the
          # turn detector confirms Hero a few frames after the buttons appear.
          old = """        if open_decision is not None:\n            oldkey = (open_decision['best'].get('hand'), open_decision['best'].get('heroTurnEpoch'))\n            if key != oldkey and snap.get('heroTurnEpoch') not in (None,0): finalize_decision()\n"""
          assert old in s
          s = s.replace(old, '')
          # Do not attach the first samples of a newly dealt hand to the old
          # hand while the new-card candidate is still stabilizing.
          old2 = """    bs = hero_button_state(im)\n    if bs.confirmed:\n"""
          new2 = """    hand_transition_pending = bool(current is not None and visible and cards is not None and tuple(cards) != tuple(current['heroCards']))\n    bs = hero_button_state(im)\n    if bs.confirmed and not hand_transition_pending:\n"""
          assert old2 in s
          s = s.replace(old2, new2)
          p.write_text(s)
          PY
          git reset --hard cdecb04b6230a343535fcca5129a14a5579ea44f
          test "$(git rev-parse HEAD)" = "cdecb04b6230a343535fcca5129a14a5579ea44f"
          echo "FROZEN_READER_HEAD=$(git rev-parse HEAD)"

      - name: Install video and offline reader dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          ffmpeg -version
          ffprobe -version
          python3 -m pip install --upgrade pip
          python3 -m pip install numpy==1.26.4 opencv-python-headless==4.10.0.84 gdown==5.2.0

      - name: Download frozen calibration and blind holdout videos
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/holdout
          python3 -m gdown --id 1d0FQNW2qziQENcwrK7YeB-xkLrdOPeBw -O '/tmp/holdout/video1.mkv'
          python3 -m gdown --id 1YKXAEqe-5gwb0iTwIF816GCv1Tc8hn0e -O '/tmp/holdout/video2.mkv'
          python3 -m gdown --id 1SAgHbXCsywFd7xu4XVZ6VW09a0O_RNfx -O '/tmp/holdout/video5.mkv'
          test "$(stat -c%s '/tmp/holdout/video1.mkv')" = "323158352"
          test "$(stat -c%s '/tmp/holdout/video2.mkv')" = "174103044"
          test "$(stat -c%s '/tmp/holdout/video5.mkv')" = "272066919"
          ffprobe -v error -select_streams v:0 -show_entries stream=width,height,r_frame_rate -of default=noprint_wrappers=1 '/tmp/holdout/video5.mkv'

      - name: Run strict blind video 5 scan
        shell: bash
        run: |
          set -euo pipefail
          python3 /tmp/video5_blind_scan.py \
            '/tmp/holdout/video1.mkv' \
            '/tmp/holdout/video2.mkv' \
            '/tmp/holdout/video5.mkv' \
            '/tmp/video5_blind_raw.json'

      - name: Upload corrected-harness output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: video5-blind-harness-v2
          path: /tmp/video5_blind_raw.json
          if-no-files-found: warn
          retention-days: 7
