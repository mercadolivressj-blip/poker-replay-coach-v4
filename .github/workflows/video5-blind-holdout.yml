name: video5-blind-holdout

on:
  push:
    branches:
      - vision-v1-brain-integration
    paths:
      - '.github/workflows/video5-blind-holdout.yml'
      - 'tools/holdout/video5_blind_scan.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  blind-video5:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout integration branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Freeze scanner then reset reader to requested HEAD
        shell: bash
        run: |
          set -euo pipefail
          cp tools/holdout/video5_blind_scan.py /tmp/video5_blind_scan.py
          # Harness-only portability/reconciliation fixes. Reader code remains
          # frozen and video 5 contributes zero labels/templates/thresholds.
          sed -i 's/assert stack\.add_labeled(/stack.add_labeled(/' /tmp/video5_blind_scan.py
          sed -i 's/assert pot\.add_labeled(/pot.add_labeled(/' /tmp/video5_blind_scan.py
          sed -i 's/assert add_commitment_labeled(/add_commitment_labeled(/' /tmp/video5_blind_scan.py
          python3 - <<'PY'
          from pathlib import Path
          p = Path('/tmp/video5_blind_scan.py')
          s = p.read_text()

          # One physical button window stays one decision even if Hero turn is
          # confirmed a few frames after the buttons first appear.
          old = """        if open_decision is not None:\n            oldkey = (open_decision['best'].get('hand'), open_decision['best'].get('heroTurnEpoch'))\n            if key != oldkey and snap.get('heroTurnEpoch') not in (None,0): finalize_decision()\n"""
          assert old in s
          s = s.replace(old, '')

          # Do not attach samples from newly dealt cards to the previous hand
          # while the new-card candidate is stabilizing.
          old2 = """    bs = hero_button_state(im)\n    if bs.confirmed:\n"""
          new2 = """    hand_transition_pending = bool(current is not None and visible and cards is not None and tuple(cards) != tuple(current['heroCards']))\n    bs = hero_button_state(im)\n    if bs.confirmed and not hand_transition_pending:\n"""
          assert old2 in s
          s = s.replace(old2, new2)

          # Harness bug found by independent visual audit: when a CALL/RAISE
          # and turn-end happen on the same sampled frame, the old harness
          # finalized the turn first and could emit a false CHECK. Reconcile
          # the commitment action before finalizing the turn, and only CHECK
          # when the player owed nothing at turn start.
          a = s.index('def finalize_turn(')
          b = s.index('\ndef new_hand', a)
          replacement = '''def finalize_turn(hand, t, seat, commits, present_now):
              if hand is None or seat is None: return
              info = hand.get('turnInfo')
              if not info or info['seat'] != seat: return
              if hand['lastEventT'].get(seat, -1e9) >= info['startT'] - .05:
                  return
              start_pc = info.get('commit')
              start_max = float(info.get('tableMax') or 0.0)
              cur_pc = commits.get(seat)
              if seat not in present_now:
                  add_event(hand, t, seat, 'FOLD', source='turn-end')
                  hand['active'].discard(seat)
              elif start_pc is not None and cur_pc is not None and cur_pc > start_pc + .02:
                  # Normally action_observe has already emitted this action on
                  # the same sample; keep this fallback conservative.
                  if hand['street'] > 0 and start_max <= .02:
                      kind = 'BET'
                  else:
                      kind = 'RAISE' if cur_pc > start_max + .02 else 'CALL'
                  add_event(hand, t, seat, kind, round2(cur_pc), 'turn-end-commitment')
              elif start_pc is not None and start_max - start_pc <= .02:
                  add_event(hand, t, seat, 'CHECK', source='turn-end')
              else:
                  hand['unresolved'].append({'t':round(t,3),'seat':seat,'reason':'turn-ended-without-resolved-action','street':hand['street']})

'''
          s = s[:a] + replacement + s[b+1:]

          old3 = """    hand['turnInfo'] = None if raw_turn is None else {'seat':raw_turn,'startT':t,'commit':commits.get(raw_turn),'eventIndex':len(hand['events'])}\n"""
          new3 = """    vals = [v for v in commits.values() if v is not None]\n    hand['turnInfo'] = None if raw_turn is None else {'seat':raw_turn,'startT':t,'commit':commits.get(raw_turn),'tableMax':max(vals) if vals else 0.0,'eventIndex':len(hand['events'])}\n"""
          assert old3 in s
          s = s.replace(old3, new3)

          old4 = """        turn_observe(current, t, raw_turn, commits, dealt_now)\n        action_observe(current, t, commits, dealt_now)\n"""
          new4 = """        action_observe(current, t, commits, dealt_now)\n        turn_observe(current, t, raw_turn, commits, dealt_now)\n"""
          assert old4 in s
          s = s.replace(old4, new4)

          p.write_text(s)
          PY
          python3 -m py_compile /tmp/video5_blind_scan.py
          git reset --hard cdecb04b6230a343535fcca5129a14a5579ea44f
          test "$(git rev-parse HEAD)" = "cdecb04b6230a343535fcca5129a14a5579ea44f"
          echo "FROZEN_READER_HEAD=$(git rev-parse HEAD)"

      - name: Install video and offline reader dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          python3 -m pip install --upgrade pip
          python3 -m pip install numpy==1.26.4 opencv-python-headless==4.10.0.84 gdown==5.2.0

      - name: Download frozen calibration and blind holdout videos
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/holdout
          python3 -m gdown --id 1d0FQNW2qziQENcwrK7YeB-xkLrdOPeBw -O '/tmp/holdout/video1.mkv'
          python3 -m gdown --id 1YKXAEqe-5gwb0iTwIF816GCv1Tc8hn0e -O '/tmp/holdout/video2.mkv'
          python3 -m gdown --id 1SAgHbXCsywFd7xu4XVZ6VW09a0O_RNfx -O '/tmp/holdout/video5.mkv'
          test "$(stat -c%s '/tmp/holdout/video1.mkv')" = "323158352"
          test "$(stat -c%s '/tmp/holdout/video2.mkv')" = "174103044"
          test "$(stat -c%s '/tmp/holdout/video5.mkv')" = "272066919"
          ffprobe -v error -select_streams v:0 -show_entries stream=width,height,r_frame_rate -of default=noprint_wrappers=1 '/tmp/holdout/video5.mkv'

      - name: Run strict blind video 5 scan
        shell: bash
        run: |
          set -euo pipefail
          python3 /tmp/video5_blind_scan.py \
            '/tmp/holdout/video1.mkv' \
            '/tmp/holdout/video2.mkv' \
            '/tmp/holdout/video5.mkv' \
            '/tmp/video5_blind_raw.json'

      - name: Upload reconciled-harness output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: video5-blind-harness-v3
          path: /tmp/video5_blind_raw.json
          if-no-files-found: warn
          retention-days: 7
