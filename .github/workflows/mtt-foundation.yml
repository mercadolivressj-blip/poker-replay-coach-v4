name: MTT Foundation
on:
  push:
    branches: [mtt-brain-v0.1-foundation, mtt-brain-v0.2-tournament-state, mtt-brain-v0.3-coverage-audit, mtt-brain-v0.4-terminal-equity, mtt-brain-v0.5-pushfold-solver, mtt-brain-v0.6-certification-gates, mtt-brain-v0.7-deadmoney-pushfold, mtt-brain-v0.8-context-safe-packs, mtt-brain-v0.9-preflop-node-routing, mtt-brain-v0.10-pushfold-consensus, mtt-brain-v0.11-equity-stability-gate, mtt-brain-v0.12-equity-snapshots, mtt-brain-v0.13-equity-shards, mtt-brain-v0.14-production-equity-pipeline, mtt-brain-v0.15-pack-integrity, mtt-brain-v0.16-verified-pushfold-suite, mtt-brain-v0.17-suite-integrity, mtt-brain-v0.18-preflop-economics, mtt-brain-v0.19-raise-rights]
    paths: ['mtt/**', '.github/workflows/mtt-foundation.yml', '.github/workflows/mtt-equity-production.yml']
  pull_request:
    paths: ['mtt/**', '.github/workflows/mtt-foundation.yml', '.github/workflows/mtt-equity-production.yml']

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Run MTT regressions
        working-directory: mtt
        run: npm test
