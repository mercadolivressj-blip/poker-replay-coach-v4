name: MTT Foundation
on:
  push:
    branches: [mtt-brain-v0.1-foundation]
  pull_request:
    paths: ['mtt/**']

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Run MTT foundation regressions
        working-directory: mtt
        run: npm test
