<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Poker Brain V1 — Eyes + Brain</title><style>body{margin:0;background:#08110e;color:#e9fff5;font:14px system-ui}main{max-width:1250px;margin:auto;padding:20px}.top{display:flex;justify-content:space-between;gap:12px;align-items:center;flex-wrap:wrap}.badge{padding:7px 10px;border:1px solid #28d17c;border-radius:999px;color:#51ef9b}.grid{display:grid;grid-template-columns:1.5fr 1fr;gap:16px;margin-top:16px}.card{background:#0d1915;border:1px solid #244337;border-radius:12px;padding:14px}video{width:100%;aspect-ratio:16/9;background:#000;border-radius:10px}button{background:#1fd077;color:#04130c;border:0;border-radius:8px;padding:10px 14px;font-weight:700;cursor:pointer}button.secondary{background:#233a31;color:#dff8eb}.state{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}.kv{background:#0a1511;border:1px solid #1d342b;padding:9px;border-radius:8px}.k{font-size:11px;color:#8bb3a1;text-transform:uppercase}.v{font:700 16px ui-monospace,monospace;margin-top:3px}.decision{font-size:30px;font-weight:900;color:#5cff9e}.muted{color:#89a99a}.lanes{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:14px}.lane{padding:10px;border:1px solid #254337;border-radius:9px}.ok{color:#59ee9e}.err{color:#ff7777}pre{white-space:pre-wrap;max-height:240px;overflow:auto;background:#07100c;padding:10px;border-radius:8px}@media(max-width:850px){.grid{grid-template-columns:1fr}.lanes{grid-template-columns:repeat(2,1fr)}}</style></head><body><main><div class="top"><div><h1 style="margin:0">Poker Brain V1</h1><div class="muted">Lovable = olhos · Vercel = cérebro</div></div><div class="badge">VISION V1 FROZEN → BRAIN V1</div></div><div style="display:flex;gap:8px;margin-top:14px"><button id="start">Compartilhar replay</button><button class="secondary" id="stop">Parar</button><button class="secondary" id="reset">Reiniciar</button></div><div class="grid"><div class="card"><video id="video" muted playsinline></video><div class="lanes" id="lanes"></div></div><div class="card"><div class="k">Decisão do cérebro</div><div class="decision" id="decision">—</div><div id="engine" class="muted">aguardando estado</div><p id="reason"></p><div class="state"><div class="kv"><div class="k">Hero</div><div class="v" id="hero">—</div></div><div class="kv"><div class="k">Board</div><div class="v" id="board">—</div></div><div class="kv"><div class="k">Pot</div><div class="v" id="pot">—</div></div><div class="kv"><div class="k">To call</div><div class="v" id="tocall">—</div></div><div class="kv"><div class="k">Stack</div><div class="v" id="stack">—</div></div><div class="kv"><div class="k">Blinds</div><div class="v" id="blinds">—</div></div><div class="kv"><div class="k">Posição</div><div class="v" id="position">—</div></div><div class="kv"><div class="k">Ações</div><div class="v" id="actions">—</div></div></div></div></div><div class="card" style="margin-top:16px"><div class="k">Log</div><pre id="log">pronto</pre></div></main><script>
const VISION='https://id-preview--e06dd5f0-7e4c-44aa-a632-13a788f9bdd2.lovable.app/api/vision/read';
const BRAIN='https://poker-brain-v1-preview.vercel.app/api/brain';
const $=id=>document.getElementById(id),video=$('video');let stream=null,running=false,generation=0,brainBusy=false,lastBrainKey='';
const state={version:'vision-v1',heroCards:[],heroPresence:null,board:[],boardPresence:null,pot:null,toCall:null,legalActions:[],players:null,activePlayers:null,heroPosition:null,heroStack:null,effectiveStack:null,blinds:null,seats:[],actionHistory:[],confidence:0,readerModel:null,capturedAt:Date.now()};
const lanes={hero:{ms:null,err:null,busy:false},board:{ms:null,err:null,busy:false},actions:{ms:null,err:null,busy:false},quick:{ms:null,err:null,busy:false}};
function log(x){$('log').textContent=new Date().toLocaleTimeString()+' '+x+'\n'+$('log').textContent.slice(0,7000)}
function render(){ $('hero').textContent=state.heroCards.join(' ')||'—';$('board').textContent=state.board.join(' ')||'—';$('pot').textContent=state.pot||'—';$('tocall').textContent=state.toCall||'—';$('stack').textContent=state.heroStack||'—';$('blinds').textContent=state.blinds||'—';$('position').textContent=state.heroPosition||'—';$('actions').textContent=state.legalActions.join(' · ')||'—';$('lanes').innerHTML=Object.entries(lanes).map(([k,v])=>`<div class="lane"><b>${k}</b><div class="${v.err?'err':'ok'}">${v.busy?'lendo…':v.err?'erro':'ok'}</div><div class="muted">${v.ms==null?'—':v.ms+' ms'}</div></div>`).join('') }
function crop(nx,ny,nw,nh,maxScale=1.6,q=.82){if(!video.videoWidth)return null;const sx=Math.round(video.videoWidth*nx),sy=Math.round(video.videoHeight*ny),sw=Math.round(video.videoWidth*nw),sh=Math.round(video.videoHeight*nh),scale=Math.min(maxScale,1280/sw),c=document.createElement('canvas');c.width=Math.round(sw*scale);c.height=Math.round(sh*scale);c.getContext('2d').drawImage(video,sx,sy,sw,sh,0,0,c.width,c.height);return c.toDataURL('image/jpeg',q)}
function full(){if(!video.videoWidth)return null;const scale=Math.min(1,1120/video.videoWidth),c=document.createElement('canvas');c.width=Math.round(video.videoWidth*scale);c.height=Math.round(video.videoHeight*scale);c.getContext('2d').drawImage(video,0,0,c.width,c.height);return c.toDataURL('image/jpeg',.72)}
async function read(scope,image){const t=performance.now();const r=await fetch(VISION,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({image,mode:'fast',scope})});if(!r.ok)throw new Error('vision '+r.status+' '+(await r.text()).slice(0,120));return {data:await r.json(),ms:Math.round(performance.now()-t)}}
function apply(scope,r){const x=r.data?.read||r.data?.result||r.data||{};state.capturedAt=Date.now();if(scope==='hero'){if(x.heroPresence)state.heroPresence=x.heroPresence;if(x.heroPresence==='present'&&Array.isArray(x.heroCards)&&x.heroCards.length===2)state.heroCards=x.heroCards;if(x.readerModel)state.readerModel=x.readerModel}else if(scope==='board'){if(x.boardPresence)state.boardPresence=x.boardPresence;if(x.boardPresence==='present'&&[3,4,5].includes(x.board?.length))state.board=x.board;if(x.boardPresence==='absent'&&Array.isArray(x.board)&&x.board.length===0)state.board=[]}else if(scope==='actions'){if(Array.isArray(x.legalActions)&&x.legalActions.length)state.legalActions=x.legalActions;if(x.toCall!=null)state.toCall=x.toCall}else if(scope==='quick'){for(const k of ['pot','heroStack','effectiveStack','blinds','heroPosition','players','activePlayers'])if(x[k]!=null)state[k]=x[k];if(Array.isArray(x.actionHistory)&&x.actionHistory.length)state.actionHistory=x.actionHistory;if(Array.isArray(x.seats)&&x.seats.length)state.seats=x.seats}if(typeof x.confidence==='number')state.confidence=x.confidence;render();brainSoon()}
async function brainSoon(){const key=[state.heroCards.join(''),state.board.join(''),state.pot,state.toCall,state.legalActions.join('-'),state.heroPosition,state.heroStack,state.blinds].join('|');if(brainBusy||key===lastBrainKey||state.heroCards.length!==2||!state.legalActions.length)return;lastBrainKey=key;brainBusy=true;try{const r=await fetch(BRAIN,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({vision:state,context:{format:'cash',tableSize:'6max'}})}),j=await r.json();const d=j.result||{};$('decision').textContent=d.decision||'ANALISANDO';$('engine').textContent=(d.engine||'')+' · confiança '+(d.confidence??0);$('reason').textContent=d.reason||'';log('BRAIN '+(d.decision||'—')+' · '+(d.engine||''))}catch(e){log('brain erro '+e.message)}finally{brainBusy=false}}
function loop(scope,interval,capture){(async()=>{const g=generation;while(running&&g===generation){if(!lanes[scope].busy){const image=capture();if(image){lanes[scope].busy=true;render();try{const r=await read(scope,image);lanes[scope].ms=r.ms;lanes[scope].err=null;apply(scope,r)}catch(e){lanes[scope].err=e.message;log(scope+' '+e.message)}finally{lanes[scope].busy=false;render()}}}await new Promise(r=>setTimeout(r,interval))}})()}
async function start(){try{stream=await navigator.mediaDevices.getDisplayMedia({video:{frameRate:10},audio:false});video.srcObject=stream;await video.play();generation++;running=true;stream.getVideoTracks()[0].addEventListener('ended',stop);loop('hero',220,()=>crop(.36,.52,.28,.24,1.6,.82));loop('board',240,()=>crop(.26,.30,.48,.16,1.6,.82));loop('actions',180,()=>crop(.38,.55,.61,.44,1.5,.76));loop('quick',250,full);log('captura iniciada')}catch(e){log('captura cancelada '+e.message)}}
function stop(){running=false;generation++;stream?.getTracks().forEach(t=>t.stop());stream=null;video.srcObject=null;log('captura parada')}
function reset(){stop();Object.assign(state,{heroCards:[],heroPresence:null,board:[],boardPresence:null,pot:null,toCall:null,legalActions:[],players:null,activePlayers:null,heroPosition:null,heroStack:null,effectiveStack:null,blinds:null,seats:[],actionHistory:[],confidence:0,readerModel:null,capturedAt:Date.now()});lastBrainKey='';$('decision').textContent='—';$('engine').textContent='aguardando estado';$('reason').textContent='';render()}
$('start').onclick=start;$('stop').onclick=stop;$('reset').onclick=reset;render();
</script></body></html>
