<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Fast Hero R3 Live</title><style>
*{box-sizing:border-box}body{margin:0;background:#04150e;color:#eafff2;font:14px system-ui}.w{max-width:1200px;margin:auto;padding:16px}.c{background:#08251a;border:1px solid #176040;border-radius:14px;padding:13px;margin:12px 0}.row{display:flex;gap:9px;flex-wrap:wrap}button,input{background:#0b2d20;color:#fff;border:1px solid #2c7453;border-radius:9px;padding:10px}input{flex:1;min-width:260px}video{width:100%;max-height:52vh;background:#000;border-radius:10px}.g{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.b{background:#041c13;border:1px solid #155238;border-radius:10px;padding:11px;min-height:105px}.v{font-size:25px;font-weight:900;color:#f2dc3f;margin-top:8px}.m{font-size:12px;color:#a9dbc1;margin-top:7px}.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}.crop{width:100%;max-height:260px;object-fit:contain;background:#000;border-radius:8px}pre{white-space:pre-wrap;max-height:320px;overflow:auto;background:#03120c;padding:10px;border-radius:8px;color:#abffd1}.ok{color:#66f0a4}.bad{color:#ff8e8e}.warn{color:#f2dc3f}@media(max-width:800px){.g,.two{grid-template-columns:1fr 1fr}}@media(max-width:520px){.g,.two{grid-template-columns:1fr}}
</style></head><body><div class="w"><h1>Fast Hero R3 Live</h1><div class="c row"><input id="key" type="password" placeholder="Gemini API key"><button id="save">Usar chave</button><button id="share">Compartilhar replay</button><button id="stop">Parar</button><button id="reset">Reset Hero</button></div><div class="c"><video id="vid" autoplay muted playsinline></video></div><div class="c g"><div class="b">Hero<div id="hero" class="v">—</div><div id="hm" class="m">aguardando</div></div><div class="b">Board<div id="board" class="v">—</div><div id="bm" class="m">aguardando Hero</div></div><div class="b">Pot<div id="pot" class="v">—</div><div id="pm" class="m">aguardando Hero</div></div><div class="b">Ações<div id="actions" class="v">—</div><div id="am" class="m">aguardando Hero</div></div></div><div class="c two"><div><b>Crop exato Hero</b><div class="m">x=.36 y=.52 w=.28 h=.24</div><img id="crop" class="crop"></div><div><b>Router</b><div id="router" class="m">—</div><div class="m">3.5 primeiro; 3.1 fallback; timeout não gera cooldown global; 429/503 gera cooldown.</div></div></div><div class="c"><pre id="log"></pre></div></div><canvas id="cv" hidden></canvas><canvas id="fp" hidden></canvas><script>
'use strict';
const $=s=>document.querySelector(s),vid=$('#vid'),cv=$('#cv'),fpc=$('#fp');let key=sessionStorage.getItem('geminiKey')||'',stream=null,run=false,gen=0,busy=false,heroLocked=false,lastFp='',sec=0;$('#key').value=key;
const specs=[{name:'gemini-3.5-flash-lite',t:3200},{name:'gemini-3.1-flash-lite',t:2400}],cool=new Map(),pref={};
const H=`Leia SOMENTE as 2 cartas do HERO neste crop de replay gravado, esquerda para direita. Formato rank+naipe s,h,d,c. Se qualquer rank ou naipe estiver incerto, heroCards=[]. Nunca chute. heroPresence present somente se ambas legíveis, absent somente se região claramente vazia, uncertain se houver carta mas ilegível. JSON {"heroCards":[],"heroPresence":"present|absent|uncertain","confidence":0}`;
const B=`Leia SOMENTE o board central. board deve ter 0,3,4 ou 5 cartas rank+naipe s,h,d,c. Parcial/animando/incerto => board=[]. JSON {"board":[],"boardPresence":"present|absent|uncertain","confidence":0}`;
const A=`Leia SOMENTE botões principais visíveis: FOLD,CHECK,CALL,BET,RAISE,ALLIN. Ignore Min,3BB,Pot,Max; Max não é ALLIN. toCall só do Call. JSON {"legalActions":[],"toCall":null,"confidence":0}`;
const Q=`Leia SOMENTE pot, heroStack e blinds. Não leia cartas. JSON {"pot":null,"heroStack":null,"blinds":null,"confidence":0}`;
function log(x,c=''){let e=document.createElement('span');e.className=c;e.textContent='['+new Date().toLocaleTimeString()+'] '+x+'\n';$('#log').prepend(e)}function meta(id,t,c=''){let e=$(id);e.textContent=t;e.className='m '+c}function router(){let n=Date.now();$('#router').textContent=specs.map(s=>{let d=cool.get(s.name);return s.name+': '+(!d||d<=n?'ok':'cooldown '+Math.ceil((d-n)/1000)+'s')+(Object.values(pref).includes(s.name)?' ★':'')}).join(' | ')}
function crop(x,y,w,h,q=.82,ms=1.6,tw=1280){if(!vid.videoWidth)return null;let sx=Math.round(vid.videoWidth*x),sy=Math.round(vid.videoHeight*y),sw=Math.round(vid.videoWidth*w),sh=Math.round(vid.videoHeight*h),sc=Math.min(ms,tw/sw),dw=Math.round(sw*sc),dh=Math.round(sh*sc);cv.width=dw;cv.height=dh;cv.getContext('2d').drawImage(vid,sx,sy,sw,sh,0,0,dw,dh);let url=cv.toDataURL('image/jpeg',q);fpc.width=16;fpc.height=8;let f=fpc.getContext('2d');f.drawImage(cv,0,0,16,8);let p=f.getImageData(0,0,16,8).data,z='';for(let i=0;i<p.length;i+=4)z+=Math.round((p[i]+p[i+1]+p[i+2])/48).toString(16);return{url,fp:z}}
function full(){let s=Math.min(1,1120/vid.videoWidth),w=Math.round(vid.videoWidth*s),h=Math.round(vid.videoHeight*s);cv.width=w;cv.height=h;cv.getContext('2d').drawImage(vid,0,0,w,h);return cv.toDataURL('image/jpeg',.72)}
async function call(model,prompt,img,to){let m=img.match(/^data:(image\/[^;]+);base64,(.+)$/),ac=new AbortController(),tm=setTimeout(()=>ac.abort(),to),t0=performance.now();try{let r=await fetch('https://generativelanguage.googleapis.com/v1beta/models/'+model+':generateContent',{method:'POST',headers:{'content-type':'application/json','x-goog-api-key':key},signal:ac.signal,body:JSON.stringify({systemInstruction:{parts:[{text:prompt}]},contents:[{role:'user',parts:[{text:'Somente JSON.'},{inlineData:{mimeType:m[1],data:m[2]}}]}],generationConfig:{responseMimeType:'application/json',temperature:0,maxOutputTokens:180}})}),j=await r.json().catch(()=>({})),lat=Math.round(performance.now()-t0);if(!r.ok){let e=new Error(j.error?.message||'HTTP '+r.status);e.status=r.status;e.lat=lat;throw e}let txt=(j.candidates?.[0]?.content?.parts||[]).map(x=>x.text||'').join('').trim(),o=JSON.parse(txt);o._model=model;o._lat=lat;return o}catch(e){if(e.name==='AbortError'){let x=new Error('timeout '+to+'ms');x.timeout=1;x.lat=Math.round(performance.now()-t0);throw x}throw e}finally{clearTimeout(tm)}}
function order(kind){let n=Date.now(),a=specs.filter(s=>(cool.get(s.name)||0)<=n);if(pref[kind])a.sort((x,y)=>(x.name===pref[kind]?-1:0)-(y.name===pref[kind]?-1:0));return a}async function route(kind,prompt,img,valid){let err,last;for(let s of order(kind)){try{let o=await call(s.name,prompt,img,s.t);last=o;if(valid&&!valid(o)){log(kind+' '+s.name+' inconclusivo '+o._lat+'ms','warn');continue}pref[kind]=s.name;router();return o}catch(e){err=e;let msg=(e.message||'').toLowerCase();if(e.status===429||e.status===503||msg.includes('high demand')||msg.includes('resource exhausted'))cool.set(s.name,Date.now()+30000);log(kind+' '+s.name+' falhou '+(e.lat||'?')+'ms: '+e.message,'bad');router()}}if(last)return last;throw err||new Error('sem modelo')}
const re=/^[2-9TJQKA][shdc]$/;function vh(o){let a=o?.heroCards||[];return o?.heroPresence==='present'&&a.length===2&&a[0]!==a[1]&&a.every(x=>re.test(x))}function vb(o){let a=o?.board||[];return(o?.boardPresence==='absent'&&a.length===0)||(o?.boardPresence==='present'&&[3,4,5].includes(a.length)&&a.every(x=>re.test(x)))}
async function heroLoop(g){if(!run||g!==gen)return;setTimeout(()=>heroLoop(g),heroLocked?900:220);if(!key||!vid.videoWidth||busy)return;let c=crop(.36,.52,.28,.24);if(!c)return;$('#crop').src=c.url;if(heroLocked&&c.fp===lastFp)return;lastFp=c.fp;busy=true;try{let o=await route('hero',H,c.url,vh);if(!run||g!==gen)return;if(vh(o)){heroLocked=true;$('#hero').textContent=o.heroCards.join(' ');meta('#hm','CONFIRMADO · '+o._model+' · '+o._lat+'ms','ok');log('Hero CONFIRMADO '+o.heroCards.join(' ')+' · '+o._model+' · '+o._lat+'ms','ok')}else meta('#hm','inconclusivo · '+o._model+' · '+o._lat+'ms','warn')}catch(e){if(!heroLocked)meta('#hm','falha: '+e.message,'bad')}finally{busy=false}}
async function secLoop(g){if(!run||g!==gen)return;setTimeout(()=>secLoop(g),450);if(!heroLocked||busy||!vid.videoWidth)return;busy=true;let i=sec++%3;try{if(i===0){meta('#bm','lendo...','warn');let c=crop(.26,.30,.48,.16),o=await route('board',B,c.url,vb);$('#board').textContent=(o.board||[]).join(' ')||'—';meta('#bm',o._model+' · '+o._lat+'ms')}else if(i===1){meta('#am','lendo...','warn');let c=crop(.38,.55,.61,.44,.76,1.5),o=await route('actions',A,c.url);$('#actions').textContent=(o.legalActions||[]).join(' · ')||'—';meta('#am',o._model+' · '+o._lat+'ms')}else{meta('#pm','lendo...','warn');let o=await route('pot',Q,full());$('#pot').textContent=o.pot||'—';meta('#pm',o._model+' · '+o._lat+'ms')}}catch(e){log('Secundário falhou: '+e.message,'bad')}finally{busy=false}}
function reset(){heroLocked=false;lastFp='';$('#hero').textContent='—';$('#board').textContent='—';$('#pot').textContent='—';$('#actions').textContent='—';meta('#hm','aguardando','warn');meta('#bm','aguardando Hero');meta('#pm','aguardando Hero');meta('#am','aguardando Hero')}
$('#save').onclick=()=>{key=$('#key').value.trim();key?sessionStorage.setItem('geminiKey',key):sessionStorage.removeItem('geminiKey');log(key?'Chave carregada.':'Chave removida.','ok')};$('#share').onclick=async()=>{if(!key)return log('Carregue a chave primeiro.','bad');try{stream?.getTracks().forEach(t=>t.stop());stream=await navigator.mediaDevices.getDisplayMedia({video:{frameRate:10},audio:false});vid.srcObject=stream;run=true;gen++;reset();let g=gen;log('Replay compartilhado. Fast Hero iniciado.','ok');heroLoop(g);secLoop(g)}catch(e){log('Falha ao compartilhar: '+e.message,'bad')}};$('#stop').onclick=()=>{run=false;gen++;stream?.getTracks().forEach(t=>t.stop());stream=null;log('Parado.')};$('#reset').onclick=()=>{gen++;reset();let g=gen;if(run){heroLoop(g);secLoop(g)}};router();
</script></body></html>
