<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Poker Replay Vision Lab</title><style>body{margin:0;background:#07120d;color:#e9f5ee;font:14px system-ui}.wrap{max-width:1200px;margin:auto;padding:20px}.row{display:flex;gap:10px;flex-wrap:wrap}.card{background:#0d2017;border:1px solid #1f4635;border-radius:14px;padding:14px;margin:12px 0}button,input{background:#112d20;color:#fff;border:1px solid #2d6049;border-radius:9px;padding:10px}button{cursor:pointer;font-weight:700}video{width:100%;background:#000;border-radius:12px}.state{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.box{background:#081912;border:1px solid #193b2c;border-radius:10px;padding:10px}.big{font-size:24px;font-weight:900;color:#e7be3a}pre{white-space:pre-wrap;max-height:260px;overflow:auto;color:#9fc7b4}@media(max-width:700px){.state{grid-template-columns:1fr 1fr}}</style></head><body><div class="wrap"><h1>Poker Replay Vision Lab</h1><p>Replay gravado/pós-jogo. Harness temporário standalone, sem Lovable.</p><div class="card row"><input id="key" placeholder="Gemini API key (fica só nesta aba)" style="flex:1;min-width:260px"><button id="save">Usar chave</button><button id="share">Compartilhar replay</button><button id="stop">Parar</button></div><div class="card"><video id="v" autoplay muted playsinline></video></div><div class="card state"><div class="box">Hero<div id="hero" class="big">—</div></div><div class="box">Board<div id="board" class="big">—</div></div><div class="box">Pot<div id="pot" class="big">—</div></div><div class="box">Ações<div id="actions" class="big">—</div></div></div><div class="card"><pre id="log"></pre></div></div><canvas id="c" hidden></canvas><script>const v=document.querySelector('#v'),c=document.querySelector('#c'),log=document.querySelector('#log');let key=sessionStorage.getItem('geminiKey')||'',stream=null,running=false,busy=false;document.querySelector('#key').value=key;const L=(m)=>{log.textContent='['+new Date().toLocaleTimeString()+'] '+m+'\n'+log.textContent};document.querySelector('#save').onclick=()=>{key=document.querySelector('#key').value.trim();key?sessionStorage.setItem('geminiKey',key):sessionStorage.removeItem('geminiKey');L(key?'Chave carregada nesta aba.':'Chave removida.')};document.querySelector('#share').onclick=async()=>{stream=await navigator.mediaDevices.getDisplayMedia({video:{frameRate:8},audio:false});v.srcObject=stream;running=true;L('Replay compartilhado.');loop()};document.querySelector('#stop').onclick=()=>{running=false;stream?.getTracks().forEach(t=>t.stop());L('Parado.')};function crop(x,y,w,h){if(!v.videoWidth)return null;const sx=Math.round(v.videoWidth*x),sy=Math.round(v.videoHeight*y),sw=Math.round(v.videoWidth*w),sh=Math.round(v.videoHeight*h),scale=Math.min(1.6,1280/sw);c.width=Math.round(sw*scale);c.height=Math.round(sh*scale);c.getContext('2d').drawImage(v,sx,sy,sw,sh,0,0,c.width,c.height);return c.toDataURL('image/jpeg',.82)}async function gemini(prompt,img,max=180){if(!key)throw new Error('Falta Gemini API key');const m=img.match(/^data:(image\/[^;]+);base64,(.+)$/);const body={systemInstruction:{parts:[{text:prompt}]},contents:[{role:'user',parts:[{text:'Responda SOMENTE JSON.'},{inlineData:{mimeType:m[1],data:m[2]}}]}],generationConfig:{responseMimeType:'application/json',temperature:0,maxOutputTokens:max}};for(const model of ['gemini-2.5-flash-lite','gemini-2.5-flash']){const r=await fetch('https://generativelanguage.googleapis.com/v1beta/models/'+model+':generateContent',{method:'POST',headers:{'content-type':'application/json','x-goog-api-key':key},body:JSON.stringify(body)});const j=await r.json();if(r.ok){const t=(j.candidates?.[0]?.content?.parts||[]).map(p=>p.text||'').join('');try{return JSON.parse(t)}catch{return {raw:t}}}if(r.status!==429)throw new Error(j.error?.message||('HTTP '+r.status))}throw new Error('Gemini indisponível')}const HERO=`Você lê SOMENTE as 2 cartas do HERO no crop inferior de uma mesa de poker gravada. Leia esquerda para direita. Formato de carta: rank + naipe s,h,d,c. Não chute. Se qualquer rank ou naipe estiver incerto, heroCards deve ser []. Diferencie 6 de 9 pela forma. Diferencie coração/ouros e espadas/paus pelo símbolo, não só cor. Retorne JSON: {"heroCards":[],"heroPresence":"present|absent|uncertain","confidence":0}`;const BOARD=`Você lê SOMENTE o board central de uma mesa de poker gravada. Retorne exatamente 0,3,4 ou5 cartas no formato rank+naipe s,h,d,c. Se qualquer carta estiver parcial/animando/incerta, board deve ser []. Não chute naipe. JSON: {"board":[],"boardPresence":"present|absent|uncertain","confidence":0}`;const ACTIONS=`Você lê SOMENTE a barra de ações do HERO em replay gravado. Liste apenas botões principais visíveis/clicáveis: FOLD,CHECK,CALL,BET,RAISE,ALLIN. Ignore atalhos Min/3BB/Pot/Max; Max não é ALLIN. Leia toCall somente do botão Call. JSON: {"legalActions":[],"toCall":null,"confidence":0}`;const QUICK=`Você lê pot e stack do HERO de uma mesa de poker gravada. Não leia cartas. JSON: {"pot":null,"heroStack":null,"blinds":null,"confidence":0}`;async function loop(){if(!running)return;setTimeout(loop,700);if(busy||!v.videoWidth||!key)return;busy=true;try{const [h,b,a,q]=await Promise.all([gemini(HERO,crop(.36,.52,.28,.24)),gemini(BOARD,crop(.26,.30,.48,.16)),gemini(ACTIONS,crop(.38,.55,.61,.44),220),gemini(QUICK,crop(0,0,1,1),160)]);document.querySelector('#hero').textContent=(h.heroCards||[]).join(' ')||'—';document.querySelector('#board').textContent=(b.board||[]).join(' ')||'—';document.querySelector('#pot').textContent=q.pot||'—';document.querySelector('#actions').textContent=(a.legalActions||[]).join(' · ')||'—';L('hero '+JSON.stringify(h)+' | board '+JSON.stringify(b))}catch(e){L('ERRO '+e.message)}finally{busy=false}}}</script></body></html>
